<section id="experience" class="py-12 overflow-hidden">
  <h2 appScrollAnimate class="text-3xl font-extrabold text-center mb-10 text-gray-800 dark:text-white tracking-wide">Work Experience</h2>

  <div class="space-y-8 relative before:absolute before:inset-0 before:ml-5 before:-translate-x-px md:before:mx-auto md:before:translate-x-0 before:h-full before:w-0.5 before:bg-gradient-to-b before:from-transparent before:via-blue-300 dark:before:via-blue-700 before:to-transparent">
    <div *ngFor="let job of experience" appScrollAnimate class="relative flex items-center justify-between md:justify-normal md:odd:flex-row-reverse group is-active">
      <!-- Icon -->
      <div class="flex items-center justify-center w-10 h-10 rounded-full border border-white dark:border-gray-800 bg-blue-500 text-white shadow shrink-0 md:order-1 md:group-odd:-translate-x-1/2 md:group-even:translate-x-1/2 group-hover:bg-blue-600 transition-colors duration-300 z-10">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
      </div>
      
      <!-- Card -->
      <div class="w-[calc(100%-4rem)] md:w-[calc(50%-2.5rem)] bg-white/80 dark:bg-gray-800/80 backdrop-blur-md p-6 rounded-2xl shadow-lg border border-white/20 dark:border-gray-700/50 transition-all duration-300 hover:shadow-2xl hover:-translate-y-1">
        <h3 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">{{ job.role }}</h3>
        <p class="text-lg font-semibold text-blue-600 dark:text-blue-400 mb-2">{{ job.company }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-5 font-medium flex items-center">
           <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
           {{ job.duration }}
        </p>
        <ul class="space-y-2 text-gray-700 dark:text-gray-300">
          <li *ngFor="let responsibility of job.responsibilities" class="flex items-start">
             <span class="text-blue-500 mr-2 mt-1.5 leading-none">&bull;</span>
             <span>{{ responsibility }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
