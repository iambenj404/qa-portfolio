<section id="projects" class="py-12 overflow-hidden">
  <h2 appScrollAnimate class="text-3xl font-extrabold text-center mb-6 text-gray-800 dark:text-white tracking-wide">Projects Showcase</h2>
  <p appScrollAnimate class="text-center text-gray-600 dark:text-gray-400 mb-12 max-w-2xl mx-auto text-lg">Here are some examples of my work, including automation frameworks and testing artifacts.</p>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let project of projects" appScrollAnimate class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md rounded-2xl shadow-lg border border-white/20 dark:border-gray-700/50 overflow-hidden flex flex-col group transition-all duration-300 hover:shadow-2xl hover:-translate-y-2">
      <div class="relative overflow-hidden w-full h-48 bg-gradient-to-br from-gray-200 to-gray-300 dark:from-gray-700 dark:to-gray-800">
        <img *ngIf="project.imageUrl" [src]="project.imageUrl" alt="{{ project.title }}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
         <div *ngIf="!project.imageUrl" class="absolute inset-0 flex items-center justify-center text-gray-400 dark:text-gray-500 transition-transform duration-500 group-hover:scale-110">
           <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
         </div>
      </div>

      <div class="p-6 flex-grow flex flex-col">
        <h3 class="text-2xl font-bold mb-3 text-gray-900 dark:text-white group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors duration-200">{{ project.title }}</h3>
        <p class="text-gray-700 dark:text-gray-300 mb-6 flex-grow leading-relaxed">{{ project.description }}</p>

        <div *ngIf="project.technologies && project.technologies.length > 0" class="mb-6">
          <div class="flex flex-wrap gap-2">
            <span *ngFor="let tech of project.technologies" class="bg-blue-50 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300 text-xs font-semibold px-3 py-1 rounded-full">{{ tech }}</span>
          </div>
        </div>

        <div class="mt-auto border-t border-gray-100 dark:border-gray-700 pt-4" *ngIf="project.link">
          <a [href]="project.link" target="_blank" rel="noopener noreferrer" class="inline-flex items-center text-blue-600 dark:text-blue-400 font-semibold hover:text-blue-800 dark:hover:text-blue-300 transition-colors duration-200 group/link" [attr.aria-label]="'View Project: ' + project.title">
            View Project Details
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1.5 transform group-hover/link:translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>
