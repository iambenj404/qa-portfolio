<section id="skills" class="py-12 overflow-hidden">
  <h2 appScrollAnimate class="text-3xl font-extrabold text-center mb-10 text-gray-800 dark:text-white tracking-wide">My Skills</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
    <div *ngFor="let skillCategory of skills" appScrollAnimate class="bg-white/80 dark:bg-gray-800/80 backdrop-blur-md p-8 rounded-2xl shadow-lg border border-white/20 dark:border-gray-700/50 hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 group">
      <div class="flex items-center mb-6">
        <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900/50 flex items-center justify-center mr-4 group-hover:bg-blue-600 transition-colors duration-300">
           <svg class="w-6 h-6 text-blue-600 dark:text-blue-400 group-hover:text-white transition-colors duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white">{{ skillCategory.category }}</h3>
      </div>
      <ul class="space-y-3 text-gray-700 dark:text-gray-300">
        <li *ngFor="let item of skillCategory.items" class="flex items-center">
          <svg class="w-4 h-4 mr-2 text-green-500" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
          <span class="font-medium">{{ item }}</span>
        </li>
      </ul>
    </div>
  </div>
</section>
